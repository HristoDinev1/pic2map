# Local development: MariaDB only.
# AWS services (S3, Cognito, Lambda) are provisioned with OpenTofu in /infra
# and called directly from the PHP backend (see backend/src/S3.php, Cognito.php).
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_USER: pic2map
      MARIADB_PASSWORD: pic2map
      MARIADB_DATABASE: pic2map
      MARIADB_ROOT_PASSWORD: pic2map
    ports: ["3306:3306"]
    volumes: ["dbdata:/var/lib/mysql"]
volumes:
  dbdata:
